<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deny Firmansyah — Junior Web Developer</title>
<meta name="description" content="Portofolio Deny Firmansyah, junior web developer (JavaScript & Node.js): dashboard data, scraper, dan aplikasi web berdatabase.">
<meta property="og:title" content="Deny Firmansyah — Junior Web Developer">
<meta property="og:description" content="Dashboard data, scraper, dan aplikasi web dengan Node.js dan JavaScript.">
<meta name="theme-color" content="#14110d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D4A857'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='%2314110d' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="progress" id="progress"></div>

<header id="top">
  <div class="wrap nav">
    <a href="#hero" class="logo"><i>◈</i><span>Deny F.</span></a>
    <nav class="links" id="links" aria-label="Navigation">
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#skills" data-i18n="nav_skills"></a>
      <a href="#projects" data-i18n="nav_projects"></a>
      <a href="#journey" data-i18n="nav_journey"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="tools">
      <button class="pill-btn" id="langBtn" aria-label="Ganti bahasa / Switch language">EN</button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
      <button class="icon-btn burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<main>
<!-- HERO -->
<section id="hero">
  <canvas id="globe" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div class="hero-text">
      <span class="status"><span class="dot"></span><span data-i18n="status"></span></span>
      <h1><span data-i18n="hi"></span> <span class="gold">Deny Firmansyah</span>.<br><span data-i18n="i_build"></span> <span class="typed" id="typed"></span></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="cta">
        <a class="btn primary" href="#projects" data-i18n="cta_projects"></a>
        <a class="btn ghost" id="cvBtn" href="assets/CV_Deny_Firmansyah_ID.pdf" download data-i18n="cta_cv"></a>
        <a class="btn ghost" href="#contact" data-i18n="cta_contact"></a>
      </div>
      <div class="socials">
        <a class="icon-btn" href="https://github.com/dnnyf-77" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">⌥</a>
        <a class="icon-btn" href="mailto:denyf990@gmail.com" aria-label="Email" title="Email">✉</a>
      </div>
    </div>
    <div class="portrait" id="portrait">
      <div class="ring r1"></div><div class="ring r2"></div>
      <img src="assets/photo.png" alt="Deny Firmansyah" width="355" height="428" fetchpriority="high">
      <div class="float f1">Node.js</div><div class="float f2">JavaScript</div><div class="float f3">SQL</div>
    </div>
  </div>
  <a href="#about" class="scroll-hint" aria-label="Scroll"><span></span></a>
</section>

<!-- STATS -->
<div class="wrap"><div class="stats" id="stats"></div></div>

<!-- ABOUT -->
<section id="about">
  <div class="wrap">
    <div class="eyebrow" data-i18n="nav_about"></div>
    <h2 data-i18n="about_title"></h2>
    <div class="about-grid">
      <div class="reveal" id="aboutText"></div>
      <div class="reveal info-card">
        <h3 data-i18n="strengths"></h3>
        <ul id="strengths"></ul>
      </div>
    </div>
  </div>
</section>

<!-- SKILLS (kubus 3D) -->
<section id="skills" class="alt">
  <div class="wrap">
    <div class="eyebrow" data-i18n="nav_skills"></div>
    <h2 data-i18n="skills_title"></h2>
    <p class="lead" data-i18n="skills_lead"></p>
    <div class="skills-grid">
      <div class="scene reveal" id="scene" aria-label="3D skill cube">
        <div class="cube" id="cube"></div>
        <div class="hint" data-i18n="drag_hint"></div>
      </div>
      <div class="reveal">
        <div class="tabs" id="skillTabs" role="tablist"></div>
        <div class="chips" id="skillChips"></div>
      </div>
    </div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="wrap">
    <div class="proj-head">
      <div>
        <div class="eyebrow" data-i18n="nav_projects"></div>
        <h2 data-i18n="projects_title"></h2>
        <p class="lead" data-i18n="projects_lead"></p>
      </div>
      <div class="tabs" id="projTabs"></div>
    </div>
    <div class="projects" id="projGrid"></div>

    <div class="gh" id="ghBlock" hidden>
      <h3 data-i18n="gh_title"></h3>
      <div class="gh-grid" id="ghGrid"></div>
      <a class="btn ghost" href="https://github.com/dnnyf-77?tab=repositories" target="_blank" rel="noopener" data-i18n="gh_all"></a>
    </div>
  </div>
</section>

<!-- JOURNEY -->
<section id="journey" class="alt">
  <div class="wrap">
    <div class="eyebrow" data-i18n="nav_journey"></div>
    <h2 data-i18n="journey_title"></h2>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="wrap">
    <div class="contact reveal">
      <div class="cinfo">
        <div class="eyebrow" data-i18n="nav_contact"></div>
        <h2 data-i18n="contact_title"></h2>
        <p class="lead" data-i18n="contact_lead"></p>
        <div class="row">✉ <a href="mailto:denyf990@gmail.com">denyf990@gmail.com</a></div>
        <div class="row">⌥ <a href="https://github.com/dnnyf-77" target="_blank" rel="noopener">github.com/dnnyf-77</a></div>
        <div class="row" id="waRow" hidden>☎ <a id="waLink" href="#" target="_blank" rel="noopener">WhatsApp</a></div>
      </div>
      <form id="form" novalidate>
        <label><span data-i18n="f_name"></span><input id="fName" autocomplete="name" required></label>
        <label><span data-i18n="f_mail"></span><input id="fMail" type="email" autocomplete="email" required></label>
        <label><span data-i18n="f_msg"></span><textarea id="fMsg" required></textarea></label>
        <button class="btn primary" type="submit" style="justify-content:center" data-i18n="f_send"></button>
        <span class="hint2" id="formHint" data-i18n="f_hint"></span>
      </form>
    </div>
  </div>
</section>
</main>

<footer><div class="wrap"><span>© <span id="yr"></span> Deny Firmansyah</span><span data-i18n="built"></span></div></footer>
<button class="totop" id="totop" aria-label="Back to top">↑</button>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet-wrap">
    <button class="close" id="mClose" aria-label="Close">×</button>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
